<!-- Mobile backdrop -->
@if (mobileOpen()) {
  <div class="pm-sidebar-backdrop" (click)="mobileClose.emit()"></div>
}

<!-- Sidebar -->
<aside class="pm-sidebar" [class.is-mobile-open]="mobileOpen()">

  <!-- Mobile close -->
  <button type="button" class="desk-mobile-close" (click)="mobileClose.emit()" aria-label="Close menu">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>

  <!-- Kicker -->
  <span class="desk-kicker">The editor's desk</span>

  <!-- Role title -->
  <p class="desk-role">{{ roleLabel() }}<br /><em>desk.</em></p>

  <!-- Nav -->
  <ul class="desk-nav">
    @for (section of nav(); track section.title ?? $index) {
      @for (item of section.items; track item.id) {
        <li [class.is-active]="activeTab() === item.id">
          <button type="button" (click)="select(item.id)">
            <span class="nav-label">{{ item.label }}</span>
            @if (item.badge != null && item.badge !== 0) {
              <span class="nav-badge">{{ item.badge }}</span>
            }
            <span class="arrow">→</span>
          </button>
        </li>
      }
    }
  </ul>

</aside>
