<main class="min-h-screen flex">
    <aside class="w-64 bg-gray-100 dark:bg-gray-900 p-4 space-y-2 shadow-[0_0_1rem_rgba(0,0,0,0.25)]">
        <div class="p-4">
            <h1 class="text-2xl font-extrabold mb-8 text-center">Printymand</h1>
            <h2 class="text-center mb-8">{{ _authContext.user()?.fullName }}</h2>
        </div>
        <div class="flex flex-col items-stretch justify-center gap-4">
            @for (route of routes; track route.path) {
                <button class="nav-link" [class.active]="activatedRoute.snapshot.firstChild?.routeConfig?.path == route.path" [routerLink]="route.path">
                    {{ route.label }}
                </button>
            }
            <button class="nav-link" (click)="logout()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Logout
            </button>
        </div>
    </aside>
    <div class="flex-1 p-4">
        <header class="text-center">
            <h1>{{ activatedRoute.snapshot.firstChild?.title }}</h1>
        </header>
        <router-outlet/>
    </div>
</main>
