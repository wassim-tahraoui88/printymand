<app-dashboard-shell eyebrow="Customer" title="Profile settings" description="Update your identity, address, and delivery notes.">
  <div class="grid gap-6 lg:grid-cols-2 lg:items-start">
    <div class="pm-panel" style="padding:1.5rem;">
      <h2 class="font-bold text-lg mb-4" style="color:var(--pm-text);">Identity</h2>
      <div class="grid gap-3">
        <label class="pm-field">
          <span class="pm-label">Avatar URL</span>
          <input class="pm-input" [ngModel]="user()?.avatar" (ngModelChange)="update('avatar', $event)" />
        </label>
        <label class="pm-field">
          <span class="pm-label">Full name</span>
          <input class="pm-input" [ngModel]="user()?.name" (ngModelChange)="update('name', $event)" />
        </label>
        <label class="pm-field">
          <span class="pm-label">Email</span>
          <input class="pm-input" [ngModel]="user()?.email" (ngModelChange)="update('email', $event)" />
        </label>
        <label class="pm-field">
          <span class="pm-label">Primary address</span>
          <input class="pm-input" [ngModel]="user()?.address" (ngModelChange)="update('address', $event)" />
        </label>
      </div>
    </div>
    <div class="pm-panel" style="padding:1.5rem;">
      <h2 class="font-bold text-lg mb-4" style="color:var(--pm-text);">Delivery notes</h2>
      <label class="pm-field">
        <span class="pm-label">Notes for delivery</span>
        <textarea class="pm-textarea" [ngModel]="user()?.customerProfile?.notes" (ngModelChange)="updateNotes($event)" placeholder="Any special delivery instructions…"></textarea>
      </label>
      <div style="background:var(--pm-surface-alt); border:1px solid var(--pm-border); border-radius:var(--pm-radius); padding:0.875rem; margin-top:0.75rem; font-size:0.82rem; color:var(--pm-text-muted);">
        Notes are stored as profile state and will sync to the backend when the API is ready.
      </div>
    </div>
  </div>
</app-dashboard-shell>
