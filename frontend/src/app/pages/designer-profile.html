<app-dashboard-shell eyebrow="Designer" title="Designer profile" description="Manage your public creative identity and payout details.">
  <div class="grid gap-6 lg:grid-cols-2 lg:items-start">
    <div class="pm-panel" style="padding:1.5rem;">
      <h2 class="font-bold text-lg mb-4" style="color:var(--pm-text);">Identity</h2>
      <div class="grid gap-3">
        <label class="pm-field">
          <span class="pm-label">Name</span>
          <input class="pm-input" [ngModel]="user()?.name" (ngModelChange)="auth.updateProfile({ name: $event })" />
        </label>
        <label class="pm-field">
          <span class="pm-label">Avatar URL</span>
          <input class="pm-input" [ngModel]="user()?.avatar" (ngModelChange)="auth.updateProfile({ avatar: $event })" />
        </label>
        <label class="pm-field">
          <span class="pm-label">Profile picture URL</span>
          <input class="pm-input" [ngModel]="user()?.designerProfile?.profilePicture" (ngModelChange)="auth.updateDesignerProfile({ profilePicture: $event })" />
        </label>
      </div>
    </div>
    <div class="pm-panel" style="padding:1.5rem;">
      <h2 class="font-bold text-lg mb-4" style="color:var(--pm-text);">Public profile</h2>
      <div class="grid gap-3">
        <label class="pm-field">
          <span class="pm-label">Banner URL</span>
          <input class="pm-input" [ngModel]="user()?.designerProfile?.banner" (ngModelChange)="auth.updateDesignerProfile({ banner: $event })" />
        </label>
        <label class="pm-field">
          <span class="pm-label">Bio</span>
          <textarea class="pm-textarea" [ngModel]="user()?.designerProfile?.bio" (ngModelChange)="auth.updateDesignerProfile({ bio: $event })" placeholder="Tell buyers about yourself…"></textarea>
        </label>
        <label class="pm-field">
          <span class="pm-label">Payout account</span>
          <input class="pm-input" [ngModel]="user()?.designerProfile?.payoutAccount" (ngModelChange)="auth.updateDesignerProfile({ payoutAccount: $event })" placeholder="RIB or payment reference" />
        </label>
      </div>
    </div>
  </div>
</app-dashboard-shell>
