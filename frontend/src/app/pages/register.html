<section class="pm-page">
  <div class="grid w-full gap-6 lg:grid-cols-[0.95fr_1.05fr]">
    <div class="pm-panel space-y-4">
      <p class="text-sm font-semibold uppercase tracking-[0.16em] text-indigo-600">Create account</p>
      <h1 class="text-3xl font-semibold text-slate-950">Join Printymand as a customer, designer, or printer.</h1>
      <p class="text-sm leading-7 text-slate-600">
        Registration assigns the right default profile structure immediately, so every role lands in a usable dashboard instead of an empty demo shell.
      </p>
    </div>

    <div class="pm-panel space-y-5">
      <form class="grid gap-4" (ngSubmit)="submit()">
        <label class="pm-field">
          <span class="pm-label">Full name</span>
          <input class="pm-input" [(ngModel)]="model.name" name="name" required />
        </label>
        <label class="pm-field">
          <span class="pm-label">Email</span>
          <input class="pm-input" type="email" [(ngModel)]="model.email" name="email" required />
        </label>
        <label class="pm-field">
          <span class="pm-label">Address</span>
          <input class="pm-input" [(ngModel)]="model.address" name="address" required />
        </label>
        <label class="pm-field">
          <span class="pm-label">Password</span>
          <input class="pm-input" type="password" [(ngModel)]="model.password" name="password" required />
        </label>
        <label class="pm-field">
          <span class="pm-label">Role</span>
          <select class="pm-select" [(ngModel)]="model.role" name="role">
            <option value="customer">Customer</option>
            <option value="designer">Designer</option>
            <option value="printer">Printer</option>
          </select>
        </label>

        @if (error()) {
          <div class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error() }}</div>
        }

        <button type="submit" class="pm-btn pm-btn-primary w-full">{{ loading() ? 'Creating account…' : 'Create account' }}</button>
      </form>

      <p class="text-sm text-slate-500">
        Already have an account?
        <a routerLink="/login" class="font-semibold text-indigo-600">Sign in</a>
      </p>
    </div>
  </div>
</section>
