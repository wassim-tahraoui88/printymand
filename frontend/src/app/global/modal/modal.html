@let _modal = modal();
@if (_modal) {
    <div class="fixed inset-0 flex items-center justify-center z-100" animate.leave="container-out">
        <div (click)="_modal.dismiss()" class="fixed w-full h-full bg-black/50" animate.enter="backdrop-in"></div>
        <div class="fixed min-w-xs max-w-9/10 md:min-w-md max-h-128 flex flex-col rounded-lg bg-zinc-50 dark:bg-zinc-800 shadow-xl gap-2 p-2" animate.enter="dialog-in">
            <h2 class="p-2">{{ _modal.title }}</h2>
            <div class="border-b border-b-zinc-500/50"></div>
            <div class="overflow-y-auto overflow-x-visible"><ng-content/></div>
            <div class="border-b border-b-zinc-500/50"></div>
            <div class="flex justify-end gap-2 py-2">
                <button class="bg-primary-600 hover:bg-primary-500 dark:bg-primary-700 dark:hover:bg-primary-800 text-sm rounded w-1/2 md:w-1/4 px-4 py-2" (click)="_modal.dismiss()">Close</button>
            </div>
        </div>
    </div>
}
